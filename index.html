<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=1"> <!-- Perubahan utama -->
    <title>Kelompok III</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
    <style>
        :root {
            --primary-color: #880e4f;
            --secondary-color: #f48fb1;
            --light-pink: #fce4ec;
            --lighter-pink: #fff0f6;
            --dark-text: #333;
            --white: #ffffff;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Reset dan Base Styles */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--light-pink), var(--lighter-pink));
            min-width: 1200px; /* Layout tetap lebar */
            overflow-x: auto; /* Scroll horizontal jika perlu */
        }

        /* Header */
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 1rem;
            text-align: center;
            font-size: 1.25rem;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* Layout Utama */
        .main-container {
            display: flex;
            width: 1200px; /* Lebar fixed */
            margin: 0 auto;
            padding: 1rem;
        }

        /* Sidebar (Selalu Terlihat) */
        .sidebar {
            width: 280px;
            background-color: var(--white);
            padding: 1.5rem;
            position: sticky;
            top: 60px;
            height: calc(100vh - 80px);
        }

        /* Konten Utama */
        .content {
            flex: 1;
            padding: 0 1.5rem;
        }
        .iframe-container {
            width: 100%;
            height: 600px; /* Tinggi fixed */
            border-radius: 10px;
            background: white;
            box-shadow: var(--shadow);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Nonaktifkan Komponen Mobile */
        .menu-toggle, .close-sidebar, .overlay {
            display: none !important;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">😈 KELOMPOK III 😈</div>
    </header>

    <div class="main-container">
        <nav class="sidebar">
            <h3 class="sidebar-title">Menu Tugas</h3>
            <ul class="nav-menu">
                <<li><a href="home.html" target="konten">🏠 HOME</a></li>
          <li><a href="member1.html" target="konten">👤 Anggota Kelompok</a></li>
          <li><a href="text.html" target="konten">📘 Tugas 1</a></li>
          <li><a href="lattabel.html" target="konten">📘 Tugas 2</a></li>
          <li><a href="latform.html" target="konten">📘 Tugas 3</a></li>
          <li><a href="frame.html" target="konten">📘 Tugas 4</a></li>
          <li><a href="latexternal.html" target="konten">🎨 Tugas 5 (External CSS)</a></li>
          <li><a href="internalstylesheet.html" target="konten">🎨 Tugas 6 (Internal CSS)</a></li>
          <li><a href="layout.html" target="konten">📘 Tugas 7</a></li>
          <li><a href="internal.html" target="konten">📘 Tugas 8</a></li>
          <li><a href="keterangan.html" target="konten">📘 Tugas 9</a></li>


            </ul>
        </nav>

        <main class="content">
            <div class="iframe-container">
                <iframe name="konten" src="home.html" title="Content Frame"></iframe>
            </div>
        </main>
    </div>
</body>
</html>
